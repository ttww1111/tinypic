<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微图菜单</title>
    <link rel="stylesheet" href="./menu.css" />
  </head>
  <body>
    <div class="menu" id="menu" role="menu" aria-label="悬浮窗菜单">
      <button class="menu-item" type="button" role="menuitem" data-action="show_main">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4.5" width="18" height="15" rx="3" />
            <path d="M3 9.5h18" />
            <path d="M6.6 7h.01" />
          </svg>
        </span>
        <span class="menu-text">显示主界面</span>
      </button>

      <button class="menu-item" type="button" role="menuitem" data-action="hide_float">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12s3.6-6 9-6 9 6 9 6-3.6 6-9 6-9-6-9-6Z" />
            <circle cx="12" cy="12" r="2.6" />
            <path d="M4.5 19.5 19.5 4.5" />
          </svg>
        </span>
        <span class="menu-text">隐藏悬浮窗</span>
      </button>

      <div class="menu-sep" role="separator"></div>

      <button class="menu-item is-danger" type="button" role="menuitem" data-action="quit">
        <span class="menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3.5v8" />
            <path d="M6.8 6.9a8 8 0 1 0 10.4 0" />
          </svg>
        </span>
        <span class="menu-text">退出微图</span>
      </button>
    </div>
    <script type="module" src="./menu.js"></script>
  </body>
</html>
