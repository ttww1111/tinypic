<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微图</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header class="topbar">
        <div class="top-actions">
          <button type="button" id="settingsBtn" class="icon-btn" aria-label="设置" title="设置">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="drop" class="drop" tabindex="0">
        <div class="drop-inner">
          <div class="drop-icon">
            <!-- 云 + 上箭头，描摹自 Tony 提供的 upload.png；描边走主程序 logo 的青系渐变 -->
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
              <defs>
                <linearGradient id="tpUpload" x1="0.1" y1="0" x2="0.5" y2="1">
                  <stop offset="0" stop-color="#06B1CC"/>
                  <stop offset="1" stop-color="#6FD9E8"/>
                </linearGradient>
              </defs>
              <g fill="none" stroke="url(#tpUpload)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.372 17.771H6.709A4.436 4.436 0 0 1 5.8351 8.9847A6.268 6.268 0 0 1 18.1649 8.9847A4.436 4.436 0 0 1 17.291 17.771H13.628"/>
                <path d="M10.067 13.945L12 11.34L13.933 13.945M12 11.34V19.44"/>
              </g>
            </svg>
          </div>
          <div class="drop-title" id="dropTitle">拖放图片到此处</div>
          <div class="drop-hint">或按 Ctrl+V 粘贴 · 支持 PNG / JPEG / WebP</div>
        </div>
      </section>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <section id="list" class="list" aria-live="polite"></section>

      <section class="outbar" id="outbar" hidden>
        <button type="button" id="clearBtn" class="text-trigger" aria-label="清空列表">清空列表</button>
        <button type="button" id="openBtn" class="text-trigger" aria-label="打开文件夹">打开文件夹</button>
      </section>

      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText"></div>
      </div>

      <footer class="footer"><span class="version-tag" id="versionTag">v0.1.0</span></footer>
    </main>

    <!-- 设置：居中弹窗 -->
    <div id="settingsSheet" class="sheet" hidden>
      <div class="sheet-backdrop" id="settingsBackdrop"></div>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheet-head"><span class="sheet-title" id="settingsTitle">设置</span><button id="settingsClose" class="close-btn" type="button" aria-label="关闭">×</button></div>
        <div class="sheet-body">
          <div class="field">
            <label class="field-label" for="outMode">保存方式</label>
            <div class="seg">
              <label class="seg-opt"><input type="radio" name="outputMode" value="ask" checked /><span>每次询问</span></label>
              <label class="seg-opt"><input type="radio" name="outputMode" value="replace" /><span>替换原文件</span></label>
              <label class="seg-opt"><input type="radio" name="outputMode" value="new_file" /><span>存为新文件</span></label>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="suffix">新文件后缀</label>
            <div class="field-row">
              <input id="suffix" class="text-input" value="_tiny" />
            </div>
          </div>

          <div class="field">
            <label class="field-label">调整尺寸</label>
            <div class="dim-inline">
              <span class="dim-tag">宽</span>
              <input id="targetWidth" class="text-input dim-input" type="number" min="1" inputmode="numeric" aria-label="宽度 (px)" />
              <span class="dim-x">×</span>
              <span class="dim-tag">高</span>
              <input id="targetHeight" class="text-input dim-input" type="number" min="1" inputmode="numeric" aria-label="高度 (px)" />
            </div>
          </div>

          <div class="field">
            <label class="field-label">保留元数据</label>
            <div class="checks">
              <label class="check"><input type="checkbox" id="keepCopyright" /><span>版权信息</span></label>
              <label class="check"><input type="checkbox" id="keepLocation" /><span>位置信息</span></label>
              <label class="check"><input type="checkbox" id="keepCreation" /><span>创建日期</span></label>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="showFloat">悬浮窗</label>
            <label class="switch">
              <input type="checkbox" id="showFloat" />
              <span class="switch-track"></span>
            </label>
          </div>

          <div class="field">
            <label class="field-label">关闭按钮</label>
            <div class="seg">
              <label class="seg-opt"><input type="radio" name="closeAction" value="ask" checked /><span>每次询问</span></label>
              <label class="seg-opt"><input type="radio" name="closeAction" value="tray" /><span>最小化到托盘</span></label>
              <label class="seg-opt"><input type="radio" name="closeAction" value="exit" /><span>直接退出</span></label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 保存方式：点击底部图标浮出 -->
    <div id="choiceModal" class="modal" hidden>
      <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
        <h2 id="choiceTitle">保存方式</h2>
        <div class="choice-actions">
          <button class="btn primary" data-choice="replace">替换原文件</button>
          <button class="btn ghost" data-choice="new_file">保留新文件</button>
        </div>
        <label class="choice-remember"><input type="checkbox" id="choiceRemember" /> 记住选择，下次不再询问</label>
      </div>
    </div>

    <!-- 关闭按钮首次询问：最小化到托盘还是直接退出 -->
    <div id="closeModal" class="modal" hidden>
      <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="closeTitle">
        <h2 id="closeTitle">关闭窗口</h2>
        <p class="modal-desc">最小化到托盘后，双击托盘图标即可重新打开</p>
        <div class="choice-actions">
          <button class="btn primary" data-close="tray">最小化到托盘</button>
          <button class="btn ghost" data-close="exit">直接退出</button>
        </div>
        <label class="choice-remember"><input type="checkbox" id="closeRemember" /> 记住我的选择，下次不再询问</label>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
