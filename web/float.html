<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微图悬浮窗</title>
    <link rel="stylesheet" href="./float.css" />
  </head>
  <body data-view="idle">
    <!-- 常态：胶囊 -->
    <div class="float-pill" id="pill" role="button" aria-label="拖入图片即可压缩，双击打开主界面">
      <span class="pill-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="tpFloat" x1="0.1" y1="0" x2="0.5" y2="1">
              <stop offset="0" stop-color="#06B1CC"/>
              <stop offset="1" stop-color="#6FD9E8"/>
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#tpFloat)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.372 17.771H6.709A4.436 4.436 0 0 1 5.8351 8.9847A6.268 6.268 0 0 1 18.1649 8.9847A4.436 4.436 0 0 1 17.291 17.771H13.628"/>
            <path d="M10.067 13.945L12 11.34L13.933 13.945M12 11.34V19.44"/>
          </g>
        </svg>
      </span>
      <span class="pill-text" id="pillText">拖拽至此压缩</span>
    </div>

    <!-- 展开态：同一张卡片承载「投放 / 进行中 / 结果」三种内容，靠 body[data-view] 切换。
         卡片 280×160，窗口 308×188（四周 14px 透明边留给阴影）。 -->
    <div class="float-card" id="card" aria-hidden="true">
      <div class="card-head" id="cardHead">
        <span class="card-title">
          <span class="card-logo">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <defs>
                <linearGradient id="tpCard" x1="0.1" y1="0" x2="0.5" y2="1">
                  <stop offset="0" stop-color="#06B1CC"/>
                  <stop offset="1" stop-color="#6FD9E8"/>
                </linearGradient>
              </defs>
              <g fill="none" stroke="url(#tpCard)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.372 17.771H6.709A4.436 4.436 0 0 1 5.8351 8.9847A6.268 6.268 0 0 1 18.1649 8.9847A4.436 4.436 0 0 1 17.291 17.771H13.628"/>
                <path d="M10.067 13.945L12 11.34L13.933 13.945M12 11.34V19.44"/>
              </g>
            </svg>
          </span>
          <span class="card-name">微图</span>
        </span>
        <button class="card-close" id="cardClose" type="button" aria-label="取消 / 关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <!-- 1) 拖拽投放 -->
      <div class="card-body card-drop" id="paneDrop">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.2" y="4.8" width="17.6" height="14.4" rx="3" />
          <circle cx="8.8" cy="9.9" r="1.55" />
          <path d="M4.2 17.6 9 12.6l3.2 3.2 2.3-2.3 4.3 4.1" />
        </svg>
        <span class="drop-text" id="dropText">拖拽至此压缩</span>
        <span class="drop-hint">PNG · JPEG · WebP</span>
      </div>

      <!-- 2) 压缩进行中 -->
      <div class="card-body card-work" id="paneWork">
        <div class="work-row">
          <span class="work-phase" id="workPhase">压缩中</span>
          <span class="work-count" id="workCount">0 / 0</span>
        </div>
        <div class="work-bar"><span class="work-fill" id="workFill"></span></div>
        <div class="work-file" id="workFile"></div>
      </div>

      <!-- 3) 结果（完成 / 失败 / 需要选择保存方式）
           「完成」的视觉主角是省下的百分比（渐变大数字），徽章只是标题前的小点缀 -->
      <div class="card-body card-result" id="paneResult">
        <div class="result-head">
          <span class="result-mark" aria-hidden="true">
            <svg class="mark-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5.5 12.6 10 17l8.5-9.6" />
            </svg>
            <svg class="mark-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
              <path d="M12 7.4v6.2M12 17.1h.01" />
            </svg>
          </span>
          <span class="result-title" id="resultTitle"></span>
        </div>
        <div class="result-hero" id="resultHero" hidden>
          <span class="hero-label">省</span><span class="hero-num" id="resultHeroNum">0%</span>
        </div>
        <div class="result-sub" id="resultSub"></div>
        <div class="result-actions" id="resultActions" hidden>
          <button class="btn btn-safe" data-mode="new_file" type="button">存为新文件</button>
          <button class="btn btn-risk" data-mode="replace" type="button">替换原文件</button>
        </div>
      </div>
    </div>

    <script type="module" src="./float.js"></script>
  </body>
</html>
